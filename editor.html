<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor - inkwell</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #fafafa;
            color: #171717;
            min-height: 100vh;
            padding: 2rem;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid #e5e5e5;
        }
        h1 {
            font-size: 1.75rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }
        .btn {
            padding: 0.5rem 1rem;
            border: 1px solid #e5e5e5;
            border-radius: 6px;
            background: white;
            color: #171717;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.2s;
        }
        .btn:hover {
            border-color: #171717;
        }
        .btn-primary {
            background: #171717;
            color: white;
            border-color: #171717;
        }
        .btn-primary:hover {
            background: #404040;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: #525252;
        }
        input[type="text"] {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #e5e5e5;
            border-radius: 6px;
            font-size: 0.875rem;
            font-family: 'Inter', -apple-system, sans-serif;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #171717;
        }
        /* Split-pane editor layout */
        .editor-split {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }
        @media (max-width: 768px) {
            .editor-split {
                grid-template-columns: 1fr;
            }
        }
        .editor-col,
        .preview-col {
            display: flex;
            flex-direction: column;
        }
        textarea {
            flex: 1;
            width: 100%;
            min-height: 400px;
            padding: 0.75rem;
            border: 1px solid #e5e5e5;
            border-radius: 6px;
            font-size: 0.875rem;
            font-family: 'SF Mono', Monaco, 'Cascadia Code', 'Roboto Mono', Consolas, 'Courier New', monospace;
            line-height: 1.6;
            resize: vertical;
            transition: border-color 0.2s;
        }
        textarea:focus {
            outline: none;
            border-color: #171717;
        }
        .actions {
            display: flex;
            gap: 0.75rem;
            justify-content: flex-end;
        }
        .help-text {
            font-size: 0.75rem;
            color: #a3a3a3;
            margin-top: 0.375rem;
        }
        /* Preview panel */
        .preview-panel {
            flex: 1;
            min-height: 400px;
            max-height: 600px;
            overflow-y: auto;
            border: 1px solid #e5e5e5;
            border-radius: 6px;
            padding: 1rem 1.25rem;
            background: white;
            font-size: 0.875rem;
            line-height: 1.7;
            color: #374151;
        }
        /* Markdown content styles */
        .preview-panel h1,
        .preview-panel h2,
        .preview-panel h3,
        .preview-panel h4,
        .preview-panel h5,
        .preview-panel h6 {
            margin: 1.25rem 0 0.5rem;
            font-weight: 600;
            line-height: 1.3;
            letter-spacing: -0.01em;
            color: #171717;
        }
        .preview-panel h1:first-child,
        .preview-panel h2:first-child,
        .preview-panel h3:first-child {
            margin-top: 0;
        }
        .preview-panel h1 { font-size: 1.5rem; }
        .preview-panel h2 { font-size: 1.25rem; }
        .preview-panel h3 { font-size: 1.0625rem; }
        .preview-panel p { margin: 0.75rem 0; }
        .preview-panel p:first-child { margin-top: 0; }
        .preview-panel ul,
        .preview-panel ol {
            margin: 0.75rem 0;
            padding-left: 1.5rem;
        }
        .preview-panel li { margin: 0.25rem 0; }
        .preview-panel a {
            color: #171717;
            text-decoration: underline;
        }
        .preview-panel strong { font-weight: 600; }
        .preview-panel em { font-style: italic; }
        .preview-panel blockquote {
            border-left: 3px solid #e5e5e5;
            margin: 1rem 0;
            padding: 0.25rem 0 0.25rem 1rem;
            color: #6b7280;
        }
        .preview-panel hr {
            border: none;
            border-top: 1px solid #e5e5e5;
            margin: 1.5rem 0;
        }
        /* Code block styling */
        .preview-panel pre {
            border-radius: 6px;
            padding: 1rem;
            overflow-x: auto;
            margin: 1rem 0;
            background: #282c34;
        }
        .preview-panel pre code {
            background: transparent !important;
            padding: 0 !important;
            font-family: 'SF Mono', Monaco, 'Cascadia Code', 'Roboto Mono', Consolas, 'Courier New', monospace;
            font-size: 0.8125rem;
            line-height: 1.6;
        }
        /* Inline code */
        .preview-panel code:not(pre code) {
            background: #f3f4f6;
            color: #374151;
            padding: 0.125rem 0.375rem;
            border-radius: 4px;
            font-family: 'SF Mono', Monaco, 'Cascadia Code', 'Roboto Mono', Consolas, 'Courier New', monospace;
            font-size: 0.8125rem;
        }
        /* Placeholder */
        .preview-placeholder {
            color: #a3a3a3;
            font-style: italic;
            font-size: 0.875rem;
        }
        /* Read status toggle */
        .btn-read-toggle {
            padding: 0.375rem 0.75rem;
            font-size: 0.75rem;
            color: #525252;
            border-color: #e5e5e5;
            display: none;
        }
        .btn-read-toggle:hover {
            background: #f5f5f5;
            border-color: #a3a3a3;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1 id="pageTitle">New Post</h1>
            <a href="manage.html" class="btn">← Back to Posts</a>
        </header>

        <form id="postForm">
            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" name="title" required placeholder="Enter post title">
            </div>

            <div class="editor-split">
                <div class="editor-col">
                    <label for="content">Write</label>
                    <textarea id="content" name="content" required placeholder="Write your post in markdown...

Example with tags:
---
title: My Post Title
tags: [javascript, web-development]
---

# Your content here

Use **markdown** for formatting.

\`\`\`js
console.log('hello world');
\`\`\`"></textarea>
                    <p class="help-text">Use markdown for formatting. Add tags in the frontmatter section (optional).</p>
                </div>
                <div class="preview-col">
                    <label>Preview</label>
                    <div class="preview-panel" id="preview">
                        <p class="preview-placeholder">Preview will appear here…</p>
                    </div>
                </div>
            </div>

            <div class="actions">
                <button type="button" class="btn btn-read-toggle" id="readToggleBtn">Mark as Unread</button>
                <a href="manage.html" class="btn">Cancel</a>
                <button type="submit" class="btn btn-primary" id="saveBtn">Save Post</button>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="editor.js"></script>
</body>
</html>
